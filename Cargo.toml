[workspace]
resolver = "2"
members = [
    "crates/gav",
    "crates/pomace",
    "crates/grale",
    "crates/gather",
    "crates/dendro",
    "crates/antlers",
    "crates/antler-lock",
    "crates/antler-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/albertocavalcante/antler"
keywords = ["maven", "gradle", "jvm", "dependency", "resolver"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# XML parsing (for POM files)
quick-xml = { version = "0.37", features = ["serialize"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Checksums
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"

# Semver
semver = "1.0"

# URL handling
url = { version = "2.5", features = ["serde"] }

# Ordered maps
indexmap = { version = "2.0", features = ["serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
gav = { path = "crates/gav" }
pomace = { path = "crates/pomace" }
grale = { path = "crates/grale" }
gather = { path = "crates/gather" }
dendro = { path = "crates/dendro" }
antlers = { path = "crates/antlers" }
antler-lock = { path = "crates/antler-lock" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
