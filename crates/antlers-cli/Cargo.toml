[package]
name = "antlers-cli"
description = "CLI tool for JVM dependency resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "antlers"
path = "src/main.rs"

[dependencies]
antlers.workspace = true

# CLI
clap.workspace = true

# Async runtime
tokio.workspace = true

# Serialization (for output formats)
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# HTTP client (for fetch command)
reqwest.workspace = true

# Checksums (for verification)
sha1.workspace = true
sha2.workspace = true

# For finding user directories
dirs = "5.0"

# For colored output
owo-colors = "4.0"

# Progress bars
indicatif = "0.17"

# For streaming downloads
futures-util = "0.3"

[lints]
workspace = true
