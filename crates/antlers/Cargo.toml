[package]
name = "antlers"
description = "High-level API for JVM dependency resolution - combines artifact model, parsing, and resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["maven", "gradle", "jvm", "dependency", "resolver"]
categories = ["development-tools"]

[features]
default = ["pom", "gmm", "fetch"]
pom = ["dep:pomace", "dep:quick-xml"]
gmm = ["dep:grale"]
fetch = ["dep:gather", "dep:tokio", "dep:futures"]

[dependencies]
gav = { workspace = true }
pomace = { workspace = true, optional = true }
grale = { workspace = true, optional = true }
dendro = { workspace = true }
gather = { workspace = true, optional = true }
antlers-lock = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
similar = { workspace = true }
quick-xml = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { version = "0.3", optional = true }
dirs = "5.0"
indexmap = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3.25"

[lints]
workspace = true
