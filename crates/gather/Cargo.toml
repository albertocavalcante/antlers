[package]
name = "gather"
description = "Artifact fetching, caching, and checksum verification for JVM dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["maven", "repository", "cache", "checksum", "fetch"]
categories = ["development-tools", "caching", "network-programming"]

[features]
default = ["http"]
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
gav = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
md5 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }

[lints]
workspace = true
