# Lefthook git hooks configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    fmt-check:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      fail_text: "Run 'cargo fmt' to fix formatting"

    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
      fail_text: "Fix clippy warnings before committing"

    check:
      glob: "*.rs"
      run: cargo check --all-targets --all-features
      fail_text: "Fix compilation errors before committing"

    workflow-lint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: ghalint run -c tools/lint/ghalint.yaml && actionlint {staged_files}
      fail_text: "Fix GitHub Actions workflow issues"

    workflow-pin:
      glob: ".github/workflows/*.{yml,yaml}"
      run: pinact run --verify -c tools/lint/pinact.yaml
      fail_text: "Run 'pinact run -u -c tools/lint/pinact.yaml' to pin action versions"

    ts-fmt:
      glob: "**/*.ts"
      exclude: "**/node_modules/**"
      run: bunx --bun prettier --check {staged_files}
      fail_text: "Run 'bunx prettier --write' to fix TypeScript formatting"

    md-fmt:
      glob: "**/*.md"
      exclude: "**/node_modules/**"
      run: bunx --bun prettier --check --prose-wrap always {staged_files}
      fail_text:
        "Run 'bunx prettier --write --prose-wrap always' to fix Markdown
        formatting"

    yaml-fmt:
      glob: "**/*.{yml,yaml}"
      exclude: "**/node_modules/**"
      run: bunx --bun prettier --check {staged_files}
      fail_text: "Run 'bunx prettier --write' to fix YAML formatting"

pre-push:
  parallel: true
  commands:
    test:
      run: cargo test --all-features
      fail_text: "Tests must pass before pushing"

commit-msg:
  commands:
    conventional:
      run: |
        msg=$(cat {1})
        if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'; then
          echo "Commit message must follow Conventional Commits format:"
          echo "  <type>[optional scope]: <description>"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo ""
          echo "Your message: $msg"
          exit 1
        fi
